<div class="error-container">
  <div class="error-content">
    <div class="error-icon">⚠️</div>
    <h1>Access Error</h1>
    <p class="error-message">
      Your account role is not recognized or you don't have permission to access this system.
    </p>
    <p class="error-submessage">
      Please contact your administrator for assistance.
    </p>
    <button class="btn-back" (click)="goToLogin()">
      Return to Login
    </button>
  </div>
</div>
