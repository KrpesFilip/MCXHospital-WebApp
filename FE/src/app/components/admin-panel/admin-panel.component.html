<div class="admin-layout">

    <!-- HEADER -->
    <app-header portalType="Admin Panel" userRole="ADMIN"></app-header>

    <!-- STATS  -->
    <section class="stats">
        <div class="stat-card">
            <strong>{{ adminUsersCount }}</strong>
            <span>Admin Users</span>
        </div>
        <div class="stat-card blue">
            <strong>{{ emsUsersCount }}</strong>
            <span>Vehicle Personnel</span>
        </div>
        <div class="stat-card green">
            <strong>{{ hospitalUsersCount }}</strong>
            <span>Hospital Users</span>
        </div>
        <div class="stat-card purple">
            <strong>{{ totalCasesCount }}</strong>
            <span>Total Cases</span>
        </div>
    </section>

    <!-- TABS  -->
    <section class="tab-wrapper">
        <div class="tab" [class.active]="activeTab === 'users'" (click)="activeTab = 'users'">
            <span class="icon">👥</span>
            <span>User Management</span>
        </div>

        <div class="tab" [class.active]="activeTab === 'cases'" (click)="activeTab = 'cases'">
            <span class="icon">📄</span>
            <span>Case Management</span>
        </div>
    </section>

    <!-- CONTENT -->
    <section class="content">
        <app-user-management *ngIf="activeTab === 'users'"></app-user-management>
        <app-case-management *ngIf="activeTab === 'cases'"></app-case-management>
    </section>

</div>
