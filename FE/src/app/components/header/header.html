<header class="universal-header">

    <span class="brand__portal">{{ portalType }}</span>
  </div>
  
  <div class="user-actions">
    <div class="user-info">
      <span class="user-name">{{ displayUsername }}</span>

    <button class="btn-logout" (click)="logout()">
      Logout
    </button>
  </div>
</header>
